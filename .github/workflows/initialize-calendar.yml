          raw = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'e43f24993b3603031c8c902028a048c00298092a774096a3b2c6634cdb221c38'
          root = pathlib.Path.cwd()
          assert not (root / 'holiday.ics').exists(), 'Already initialized; refusing to overwrite history'
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in {'.github', '.git'}
                  destination = root.joinpath(*path.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(entry))
          print('Extracted verified initial project files')
