      - name: Validate all files before committing
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          python scripts/holiday_calendar.py validate
      - name: Commit initial validated project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html holiday.ics .gitignore .nojekyll data scripts tests requirements-dev.txt CHANGELOG.md CHECKS.md
          git commit -m 'feat: publish official holiday calendar with persistent annual history'
          git push origin HEAD:main
