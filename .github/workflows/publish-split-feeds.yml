          raw = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'b1ffeecd869c225574611d755258fea39cc385908a3b589bd1a61ea0c26e9d94'
          root = pathlib.Path.cwd()
          assert hashlib.sha256((root / 'holiday.ics').read_bytes()).hexdigest() == 'c5d5f48a4f82351625c36d253294df7f88ea8aa3ebc9e798a4b24dd7eb96a219', 'Merged calendar changed; review before applying'
          entries = json.loads(gzip.decompress(raw))
          staged = []
          for entry in entries:
              path = pathlib.PurePosixPath(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in {'.github', '.git'}
              target = root.joinpath(*path.parts)
              current = hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
              assert current == entry['before'], 'Concurrent change detected: ' + entry['path']
              data = base64.b64decode(entry['data'], validate=True)
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
              staged.append((target, data))
          for target, data in staged:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          print('Applied reviewed split-feed files without changing the merged calendar')
          PYSPLIT
      - name: Verify calendars and history before committing
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          python scripts/holiday_calendar.py validate
      - name: Commit validated split subscriptions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md index.html scripts/holiday_calendar.py scripts/verify_published.py tests/test_calendar.py holidays.ics workdays.ics
          git commit -m 'feat: separate holiday and make-up workday subscription feeds'
          git push origin HEAD:main
