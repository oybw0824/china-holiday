          raw = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(raw).hexdigest() == '13864dccfcf462586293f35500fbe7a08ac40740ce5939d0adc47204fc020d5a'
          root = pathlib.Path.cwd()
          entries = json.loads(gzip.decompress(raw))
          staged = []
          for entry in entries:
              path = pathlib.PurePosixPath(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in {'.github', '.git'}
              target = root.joinpath(*path.parts)
              assert hashlib.sha256(target.read_bytes()).hexdigest() == entry['before'], 'Concurrent change: ' + entry['path']
              data = base64.b64decode(entry['data'], validate=True)
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
              staged.append((target, data))
          for target, data in staged:
              target.write_bytes(data)
          print('Renamed workday events to 班 while preserving UIDs and dates')
          PYRENAME
      - name: Validate calendars before committing
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          python scripts/holiday_calendar.py validate
      - name: Commit short workday titles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md data/years/2027.json holiday.ics index.html scripts/holiday_calendar.py tests/test_calendar.py workdays.ics
          git commit -m 'fix: shorten make-up workday event titles to 班'
          git push origin HEAD:main
